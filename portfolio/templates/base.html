<!doctype html>

<html class="dark" lang="en" style="scroll-behavior: smooth">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>YUS_DEV | {% block title %} {% endblock %}</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "surface-container-high": "#042e39",
              "surface-container-low": "#001f28",
              background: "#00161d",
              "inverse-surface": "#c3e8f7",
              "tertiary-fixed": "#dee2ed",
              "on-secondary-container": "#d0a6ff",
              "surface-container-highest": "#133945",
              "tertiary-fixed-dim": "#c2c7d0",
              "on-surface-variant": "#bfc8ca",
              "on-primary-fixed": "#002022",
              "on-secondary": "#470083",
              "surface-tint": "#55d8e1",
              "on-primary": "#003739",
              "on-tertiary-fixed-variant": "#42474f",
              "on-secondary-fixed": "#2b0053",
              "outline-variant": "#40484a",
              "surface-variant": "#133945",
              "secondary-fixed-dim": "#dbb8ff",
              "on-tertiary": "#2c3138",
              "error-container": "#93000a",
              "on-tertiary-container": "#acb1bb",
              "surface-dim": "#00161d",
              "on-error": "#690005",
              "secondary-container": "#6327a1",
              "on-primary-container": "#37c2ca",
              "primary-fixed-dim": "#55d8e1",
              "on-tertiary-fixed": "#171c23",
              primary: "#55d8e1",
              "on-primary-fixed-variant": "#004f53",
              "surface-bright": "#183e49",
              secondary: "#dbb8ff",
              "tertiary-container": "#3f444c",
              "on-error-container": "#ffdad6",
              "on-surface": "#c3e8f7",
              "on-background": "#c3e8f7",
              outline: "#8a9295",
              "inverse-primary": "#00696e",
              "on-secondary-fixed-variant": "#60249f",
              tertiary: "#c2c7d0",
              surface: "#00161d",
              "primary-container": "#004c50",
              "surface-container-lowest": "#001016",
              error: "#ffb4ab",
              "inverse-on-surface": "#0d3540",
              "secondary-fixed": "#efdbff",
              "surface-container": "#00232d",
              "primary-fixed": "#75f5fd",
            },
            borderRadius: {
              DEFAULT: "0.125rem",
              lg: "0.25rem",
              xl: "0.5rem",
              full: "0.75rem",
            },
            fontFamily: {
              headline: ["Space Grotesk"],
              body: ["Inter"],
              label: ["Inter"],
            },
          },
        },
      };
    </script>
    <style type="text/tailwindcss">
      body {
        background-color: #00161d;
        font-family: "Inter", sans-serif;
        color: #c3e8f7;
        overflow-x: hidden;
      }
      .material-symbols-outlined {
        font-variation-settings:
          "FILL" 0,
          "wght" 400,
          "GRAD" 0,
          "opsz" 24;
      }
      .font-headline {
        font-family: "Space Grotesk", sans-serif;
      }
      .cyber-grid {
        background-image:
          linear-gradient(
            to right,
            rgba(85, 216, 225, 0.05) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            rgba(85, 216, 225, 0.05) 1px,
            transparent 1px
          );
        background-size: 40px 40px;
      }
      .blueprint-lines {
        background-image:
          linear-gradient(rgba(85, 216, 225, 0.05) 2px, transparent 2px),
          linear-gradient(90deg, rgba(85, 216, 225, 0.05) 2px, transparent 2px);
        background-size: 200px 200px;
      }
      .digital-rain {
        background:
          linear-gradient(rgba(0, 22, 29, 0.9), rgba(0, 22, 29, 0.9)),
          url("https://images.unsplash.com/photo-1550745165-9bc0b252726f?q=80&w=2070&auto=format&fit=crop");
        background-blend-mode: multiply;
      }
      .circuit-pattern {
        background-image: radial-gradient(
          circle at 2px 2px,
          rgba(219, 184, 255, 0.15) 1px,
          transparent 0
        );
        background-size: 24px 24px;
      }
      .glitch-border {
        position: relative;
        border: 1px solid rgba(85, 216, 225, 0.3);
        box-shadow: 0 0 15px rgba(85, 216, 225, 0.1);
      }
      .glitch-border::before {
        content: "";
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        border: 1px solid rgba(219, 184, 255, 0.5);
        clip-path: polygon(0 0, 10% 0, 10% 100%, 0 100%);
      }
    </style>
  </head>
  <body class="bg-surface selection:bg-secondary/30 cyber-grid">
    <nav
      class="fixed top-0 w-full z-50 bg-[#00161d]/80 backdrop-blur-xl border-b border-primary/10"
    >
      <div
        class="flex justify-between items-center px-8 py-4 max-w-7xl mx-auto"
      >
        <div
          class="text-xl font-bold tracking-widest text-[#55d8e1] font-['Space_Grotesk']"
        >
          YUS_DEV
        </div>
        <div class="hidden md:flex gap-8 items-center">
          <a
            class="text-[#55d8e1] font-bold border-b-2 border-[#dbb8ff] pb-1 font-['Space_Grotesk'] tracking-tight"
            href="#home"
            >Home</a
          >
          <a
            class="text-slate-400 font-medium hover:text-[#55d8e1] transition-all duration-300 font-['Space_Grotesk'] tracking-tight"
            href="#projects"
            >Projects</a
          >
          <a
            class="text-slate-400 font-medium hover:text-[#55d8e1] transition-all duration-300 font-['Space_Grotesk'] tracking-tight"
            href="#skills"
            >Skills</a
          >
          <a
            class="text-slate-400 font-medium hover:text-[#55d8e1] transition-all duration-300 font-['Space_Grotesk'] tracking-tight"
            href="#contact"
            >Contact</a
          >
        </div>
        <button
          class="bg-gradient-to-r from-primary to-secondary-container text-on-primary px-6 py-2 rounded-xl font-bold text-sm tracking-widest hover:scale-105 transition-transform duration-200"
        >
          RESUME
        </button>
      </div>
    </nav>

    <!-- <main></main> -->
    {% block content %} {% endblock %}

    <!-- Footer -->
    <footer class="bg-[#001016] w-full py-12 px-8 border-t border-primary/10">
      <div
        class="flex flex-col md:flex-row justify-between items-center gap-6 max-w-7xl mx-auto"
      >
        <div
          class="font-['Inter'] uppercase tracking-[0.2em] text-[10px] text-slate-500 bg-surface-container px-3 py-1 border border-primary/5"
        >
          © 2024 SYNTAX_ARCHITECT // SECURE_ESTABLISHED_CONNECTION
        </div>
        <div class="flex gap-8">
          <a
            class="font-['Inter'] uppercase tracking-[0.1em] text-[10px] text-slate-500 hover:text-primary transition-colors border-b border-transparent hover:border-primary"
            href="#"
            >GitHub</a
          >
          <a
            class="font-['Inter'] uppercase tracking-[0.1em] text-[10px] text-slate-500 hover:text-primary transition-colors border-b border-transparent hover:border-primary"
            href="#"
            >LinkedIn</a
          >
          <a
            class="font-['Inter'] uppercase tracking-[0.1em] text-[10px] text-slate-500 hover:text-primary transition-colors border-b border-transparent hover:border-primary"
            href="#"
            >Docs</a
          >
          <a
            class="font-['Inter'] uppercase tracking-[0.1em] text-[10px] text-slate-500 hover:text-primary transition-colors border-b border-transparent hover:border-primary"
            href="#"
            >Src</a
          >
        </div>
      </div>
    </footer>
    <a
      aria-label="Chat on WhatsApp"
      class="fixed bottom-24 right-8 z-50 w-12 h-12 bg-surface-container-highest/60 backdrop-blur-md border border-secondary/30 text-primary flex items-center justify-center rounded-none shadow-lg hover:bg-surface-container-highest/80 hover:border-secondary/60 hover:shadow-[0_0_15px_rgba(219,184,255,0.2)] transition-all duration-300 group"
      href="https://wa.me/yournumber"
      target="_blank"
    >
      <svg
        class="w-6 h-6 fill-primary group-hover:scale-110 transition-transform"
        viewbox="0 0 24 24"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"
        ></path>
      </svg>
      <div
        class="absolute -top-1 -left-1 w-2 h-2 bg-secondary opacity-0 group-hover:opacity-100 transition-opacity"
      ></div> </a
    ><a
      aria-label="Back to top"
      class="fixed bottom-8 right-8 z-50 w-12 h-12 bg-[#00161d]/60 backdrop-blur-md border border-primary/20 text-primary flex items-center justify-center rounded-none shadow-lg hover:bg-primary/10 hover:border-primary/60 hover:shadow-primary/20 transition-all duration-300 group"
      href="#home"
    >
      <span
        class="material-symbols-outlined group-hover:-translate-y-1 transition-transform duration-300"
        >expand_less</span
      >
      <div
        class="absolute -top-1 -right-1 w-2 h-2 bg-secondary opacity-0 group-hover:opacity-100 transition-opacity"
      ></div>
    </a>
  </body>
</html>
